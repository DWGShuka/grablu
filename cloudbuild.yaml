steps:
  # テストをDockerコンテナ内で実行
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # ネットワークを作成
        docker network create test-network || true
        
        # PostgreSQLコンテナを起動
        docker run -d --name test-postgres --network test-network \
          -e POSTGRES_DB=grablu_test \
          -e POSTGRES_USER=grablu \
          -e POSTGRES_PASSWORD=grablu2026 \
          postgres:16-alpine
        
        # PostgreSQLが起動するまで待機
        sleep 10
        
        # テストコンテナを実行
        docker run --rm --network test-network \
          -v $(pwd):/app -w /app \
          -e DATABASE_URL=postgresql://grablu:grablu2026@test-postgres:5432/grablu_test \
          -e PYTHONIOENCODING=utf-8 \
          python:3.11-slim bash -c "
            pip install -q -r requirements.txt && \
            python -m pytest tests/ -v --tb=short
          "
        
        # クリーンアップ
        docker stop test-postgres || true
        docker rm test-postgres || true
        docker network rm test-network || true
    id: 'run-tests'
  
  # Dockerイメージをビルド（キャッシュ活用）
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '--cache-from=asia-northeast1-docker.pkg.dev/$PROJECT_ID/grablu-repo/grablu:latest'
      - '--build-arg=BUILDKIT_INLINE_CACHE=1'
      - '-t'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/grablu-repo/grablu:$COMMIT_SHA'
      - '.'
    id: 'build-image'
    waitFor: ['run-tests']
  
  # 最新タグも付ける
  - name: 'gcr.io/cloud-builders/docker'
    args: ['tag', 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/grablu-repo/grablu:$COMMIT_SHA', 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/grablu-repo/grablu:latest']
    id: 'tag-image'
    waitFor: ['build-image']
  
  # Artifact Registryにプッシュ
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/grablu-repo/grablu:$COMMIT_SHA']
    id: 'push-sha'
    waitFor: ['tag-image']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/grablu-repo/grablu:latest']
    id: 'push-latest'
    waitFor: ['tag-image']
  
  # Cloud Runにデプロイ
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'grablu'
      - '--image=asia-northeast1-docker.pkg.dev/$PROJECT_ID/grablu-repo/grablu:$COMMIT_SHA'
      - '--region=asia-northeast1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--max-instances=10'
      - '--min-instances=0'
      - '--update-secrets=DB_PASSWORD=db-password:latest'
      - '--add-cloudsql-instances=granblue-fantasy-456718:asia-northeast1:grablu-db'
    waitFor: ['push-sha', 'push-latest']

images:
  - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/grablu-repo/grablu:$COMMIT_SHA'
  - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/grablu-repo/grablu:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'  # ビルド高速化
  
# 変数定義（トリガー実行時にオーバーライド可能）
substitutions:
  _USE_CACHE: 'true'  # falseに設定するとキャッシュなしビルド
