# Docker Compose設定（ローカル開発用）

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grablu
      POSTGRES_USER: grablu
      POSTGRES_PASSWORD: ${DB_PASSWORD:-grablu2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grablu"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./templates:/app/templates
      - ./config.yaml:/app/config.yaml
      - ./credentials.json:/app/credentials.json
      - ./graphs:/app/graphs
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://grablu:${DB_PASSWORD:-grablu2026}@db:5432/grablu
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SECRET_KEY=${SECRET_KEY}
      - BASE_URL=${BASE_URL:-http://localhost:8080}
      - DEV_MODE=true
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn web_app:app --host 0.0.0.0 --port 8080 --reload

volumes:
  postgres_data:
