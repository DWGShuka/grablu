# Docker Compose設定（ローカル開発用）

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grablu
      POSTGRES_USER: grablu
      POSTGRES_PASSWORD: grablu2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grablu"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./templates:/app/templates
      - ./config.yaml:/app/config.yaml
      - ./credentials.json:/app/credentials.json
      - ./graphs:/app/graphs
    environment:
      - USERNAME=admin
      - PASSWORD=grablu2026
      - DATABASE_URL=postgresql://grablu:grablu2026@db:5432/grablu
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
